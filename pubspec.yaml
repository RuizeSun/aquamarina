name: aquamarina
description: "Aquamarina"
publish_to: "none"
version: 1.0.5+6

environment:
    sdk: ^3.11.5

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    sqflite: ^2.4.2
    path_provider: ^2.1.5
    path: ^1.9.1
    sqflite_common_ffi: ^2.3.4+4
    shared_preferences: ^2.3.5
    archive: ^4.0.2
    package_info_plus: ^10.2.1
    dio: ^5.11.0
    flutter_secure_storage: ^10.3.1
    uuid: ^4.6.0
    flutter_tts: ^4.2.5
    flutter_edge_tts: ^0.0.2
    audioplayers: ^6.8.1
    flutter_launcher_icons: ^0.14.4
    file_selector: ^1.1.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/databases.zip

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icon.png"
