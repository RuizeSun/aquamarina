name: aquamarina
description: "Aquamarina"
publish_to: "none"
version: 1.4.4+27

environment:
    sdk: ^3.11.5

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    sqflite: ^2.4.2
    path_provider: ^2.1.5
    path: ^1.9.1
    sqflite_common_ffi: ^2.3.4+4
    shared_preferences: ^2.3.5
    archive: ^4.0.2
    package_info_plus: ^10.2.1
    dio: ^5.11.0
    flutter_secure_storage: ^10.3.1
    uuid: ^4.6.0
    flutter_tts: ^4.2.5
    flutter_edge_tts: ^0.0.2
    audioplayers: ^6.8.1
    flutter_launcher_icons: ^0.14.4
    file_selector: ^1.1.0
    share_plus: ^13.3.0
    url_launcher: ^6.3.1
    crypto: ^3.0.7
    connectivity_plus: ^6.1.5
    minio: ^3.5.8
    # 二维码分享 / 扫码导入：渲染、相机扫码（无 Windows）、纯 Dart 解码、剪贴板图片
    qr_flutter: ^4.1.0
    mobile_scanner: ^7.5.0
    zxing2: ^0.2.4
    # 4.11.0+ 的 PNG 解码依赖 archive 4.4+，与工程锁定的 archive 4.0.9 不兼容，故上限锁在 4.10.x
    image: '>=4.3.0 <4.11.0'
    pasteboard: ^0.5.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    fake_async: ^1.3.3

flutter:
    uses-material-design: true

    assets:
        - assets/databases.zip

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icon.png"
