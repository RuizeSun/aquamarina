name: Flutter Build (Android + Windows)

on:
    push:
        branches: [main, master]
        tags:
            - "*"
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    build:
        runs-on: ${{ matrix.os }}
        # ----- 新增条件：只对包含 (build-request) 的 commit/PR 或 tag 触发 -----
        if: |
            (github.event_name == 'push' && contains(github.event.head_commit.message, '(build-request)')) ||
            (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '(build-request)')) ||
            github.event_name == 'workflow_dispatch' ||
            startsWith(github.ref, 'refs/tags/')
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: android
                    - os: windows-latest
                      platform: windows
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache Pub packages
              uses: actions/cache@v4
              with:
                  path: ~/.pub-cache
                  key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pub-
            - name: Set up JDK 17
              if: matrix.platform == 'android'
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.44.8"
                  channel: "stable"

            - name: Enable Windows desktop support
              if: matrix.platform == 'windows'
              run: flutter config --enable-windows-desktop

            - name: Install dependencies
              run: flutter pub get

            # ========== Android 构建（分架构） ==========
            - name: Build Android APK (split per ABI)
              if: matrix.platform == 'android'
              run: flutter build apk --release --split-per-abi

            - name: Sign Android APKs
              if: matrix.platform == 'android'
              uses: r0adkll/sign-android-release@v1.0.4
              with:
                  releaseDirectory: build/app/outputs/apk/release
                  signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
                  alias: ${{ secrets.KEY_ALIAS }}
                  keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
                  keyPassword: ${{ secrets.KEY_PASSWORD }}
              env:
                  BUILD_TOOLS_VERSION: "34.0.0"

            - name: Upload signed APKs (as artifact)
              if: matrix.platform == 'android'
              uses: actions/upload-artifact@v4
              with:
                  name: android-apk-signed
                  path: build/app/outputs/apk/release/*.apk

            # ========== Windows 构建 ==========
            - name: Build Windows executable
              if: matrix.platform == 'windows'
              run: flutter build windows --release

            - name: Upload Windows executable (as artifact)
              if: matrix.platform == 'windows'
              uses: actions/upload-artifact@v4
              with:
                  name: windows-app
                  path: build/windows/x64/runner/Release/

    # ========== 发布到 GitHub Release ==========
    release:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            # 1. 检出代码（需完整历史，以便获取所有 Tag 和 Commit）
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # 获取全部历史

            # 2. 获取上一个 Tag 及 Commit 列表
            - name: Generate commit list since previous tag
              id: commit_list
              run: |
                  # 当前 Tag（从 GITHUB_REF 提取）
                  CURRENT_TAG=${GITHUB_REF#refs/tags/}
                  echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT

                  # 尝试获取上一个 Tag（HEAD^ 之前最近的 Tag）
                  PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
                  echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

                  # 生成 Commit 列表（只取标题）
                  if [ -z "$PREV_TAG" ]; then
                      # 如果没有上一个 Tag，列出所有 Commit
                      COMMITS=$(git log --pretty=format:"- %s" HEAD)
                  else
                      COMMITS=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
                  fi

                  # 若列表为空，给出占位信息
                  if [ -z "$COMMITS" ]; then
                      COMMITS="No new commits."
                  fi

                  # 保存多行输出
                  echo "commit_list<<EOF" >> $GITHUB_OUTPUT
                  echo "$COMMITS" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            # 3. 下载构建产物（Build Job 生成的 Artifacts）
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts

            # 4. 打包 Windows 应用（原步骤）
            - name: Zip Windows app
              run: zip -r windows-app.zip release-artifacts/windows-app

            # 5. 上传到 Release，并附上 Commit 列表作为正文
            - name: Upload to Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-artifacts/android-apk-signed/*.apk
                      windows-app.zip
                  body: |
                      ## 📝 Commits since previous release:
                      ${{ steps.commit_list.outputs.commit_list }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
